name: Publish Extension

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Test extension
        run: xvfb-run -a npm test

      - name: Verify Marketplace credentials
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        run: |
          if [ -z "$VSCE_PAT" ]; then
            echo "::error::Set the VSCE_PAT repository secret to a Visual Studio Marketplace access token."
            exit 1
          fi

          npx --yes @vscode/vsce@4 ls-publishers

      - name: Publish to VS Code Marketplace
        if: github.event_name == 'release'
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        run: |
          if [ -z "$VSCE_PAT" ]; then
            echo "::error::Set the VSCE_PAT repository secret to a Visual Studio Marketplace access token."
            exit 1
          fi

          npx --yes @vscode/vsce@4 publish
