name: Publish Extension

on:
  release:
    types: [published] # Triggers when you create a GitHub Release

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-size: 20
          cache: 'npm' # or 'yarn' / 'pnpm' depending on your setup

      - name: Install dependencies
        run: npm ci # Ensures a clean, reproducible installation of your packages

      - name: Build Extension
        run: npm run vscode:prepublish # Runs your compilation/build steps (e.g., TypeScript)

      - name: Publish to VS Code Marketplace
        run: npx @vscode/vsce publish -p ${{ secrets.VSCE_PAT }}
